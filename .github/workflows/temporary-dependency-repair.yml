name: Temporary dependency repair
on:
  push:
    branches: [security/limit-dev-server-exposure-20261103]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fix compatible vulnerable dependencies
        run: npm audit fix
      - name: Check installation
        run: npm ci
      - name: Test routes
        run: npm test
      - name: Audit all severities
        run: npm audit --audit-level=low
      - name: Save verified dependency updates
        run: |
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json
            git commit -m "security: update vulnerable npm dependencies"
            git push origin HEAD:security/limit-dev-server-exposure-20261103
          fi
