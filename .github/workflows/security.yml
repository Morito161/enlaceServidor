name: Security and route tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/limit-dev-server-exposure-20261103'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/limit-dev-server-exposure-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install ejs@^7.0.2
      - run: npm audit fix
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=low
      - name: Save updated dependencies
        run: |
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json
            git commit -m "security: update vulnerable npm dependencies"
            git push origin HEAD:security/limit-dev-server-exposure-20261103
          fi
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
